<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header style="
        background-image: url('img/背景.jpg');
        background-size: cover;
        background-position: center;
        height: 250px;

        display: flex;
        justify-content: center;
        align-items: center;
    ">

        <h1 style="
        color: rgb(0, 0, 0);
        margin: 0;
        font-size: clamp(40px, 8vw, 70px);
        font-weight: bold;
    ">
            スピードラン詳細ページ
        </h1>
    </header>

    <!-- 処理①：先行入力処理 -->
    <section class="script-block">
        <img src="img/先行入力処理.png" alt="先行入力処理" class="scripts-img">

        <div class="script-text">
            <h2>先行入力処理</h2>
            <p>
                ジャンプ入力を少し早く行っても反応するようにするため、
                入力を一定時間保持し、着地した瞬間にジャンプ処理を実行する仕組みを実装しました。
            </p>
            <p>
                これにより、プレイヤーが操作しやすく、スピード感のあるプレイが可能になります。
            </p>
        </div>
    </section>


    <!-- 処理②：大ジャンプ処理 -->
    <section class="script-block">
        <div class="script-images">
            <img src="img/大ジャンプ上.png" alt="大ジャンプ処理" class="scripts-img large">
            <img src="img/大ジャンプ下.png" alt="大ジャンプ処理" class="scripts-img large">
        </div>
        <div class="script-text">
            <h2>大ジャンプ処理</h2>
            <p>
                通常ジャンプとは別に、タップ時に上にスワイプすることにより高くジャンプできる大ジャンプを実装しました。
            </p>
            <p>
                プレイヤーは状況に応じてジャンプを使い分ける必要があり、
                ルート選択の幅が広がります。
            </p>
        </div>
    </section>

</body>

</html>
